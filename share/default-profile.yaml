# from the fixture repository is named. Two accounts in one team, no bundles,
# and no generators, so the first start is an empty workspace. Name every
# project created here '<YYYYMMDD> <Area>: <what it shows>'.
description: The default users of a worktree database, with no fixtures
users:
  - email: odysseus@penpot.app
    fullname: Odysseus
    password: "123123"
  - email: hermes@penpot.app
    fullname: Hermes
    password: "123123"
    agent: true
teams:
  - name: Work on this worktree
    members:
      - {email: odysseus@penpot.app, role: owner}
      - {email: hermes@penpot.app, role: editor}
bundles: []
